[theme]
base = "light"
primaryColor = "#0F6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8F9"
textColor = "#1B2228"
linkColor = "#0F6B6B"
borderColor = "#E2E6E9"
baseRadius = "8px"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#F3F5F6"
secondaryBackgroundColor = "#FFFFFF"

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
headless = true
